name: Run on Limrun

on: [push]

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate Limrun
        run: npx -y lim set-api-key ${{ secrets.LIMRUN_API_KEY }}

      - name: Build and Run on Emulator
        run: npx -y lim run
